{% extends "base.html" %}

{% block contain %}

    <div class="max-w-5xl mx-auto py-10 px-6">

        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-8">

            <div class="text-center mb-8">

                <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center">
                    <i class="bi bi-person-plus-fill text-3xl text-blue-400"></i>
                </div>

                <h1 class="text-4xl font-bold text-white">
                    Add Student
                </h1>

                <p class="text-slate-400 mt-2">
                    Enter student details below
                </p>

            </div>


            <form method="post" enctype="multipart/form-data">

                {% csrf_token %}
                
                <div class="grid md:grid-cols-2 gap-6">


                    <div>

                        <label class="block font-semibold mb-2 text-slate-300">
                            First Name
                        </label>

                        <input type="text"
                            name="name"
                            placeholder="Enter First Name"
                            class="w-full bg-slate-800 border border-slate-700 text-white placeholder-slate-500 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">

                    </div>


                    <div>

                        <label class="block font-semibold mb-2 text-slate-300">
                            Gender
                        </label>

                        <select name="gender"
                            class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">

                            <option>Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>

                        </select>

                    </div>


                    <div>

                        <label class="block font-semibold mb-2 text-slate-300">
                            Phone Number
                        </label>

                        <input type="number"
                            name="phone"
                            placeholder="Enter Phone Number"
                            class="w-full bg-slate-800 border border-slate-700 text-white placeholder-slate-500 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">

                    </div>


                    <div>

                        <label class="block font-semibold mb-2 text-slate-300">
                            City
                        </label>

                        <input type="text"
                            name="city"
                            placeholder="Enter City"
                            class="w-full bg-slate-800 border border-slate-700 text-white placeholder-slate-500 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">

                    </div>


                    <div>

                        <label class="block font-semibold mb-2 text-slate-300">
                            Course
                        </label>

                        <input name="course"
                            class="w-full bg-slate-800 border border-slate-700 text-white placeholder-slate-500 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">

                    </div>


                    <div>

                        <label class="block font-semibold mb-2 text-slate-300">
                            Fees
                        </label>

                        <input type="number"
                            name="fees"
                            placeholder="Enter Fees"
                            class="w-full bg-slate-800 border border-slate-700 text-white placeholder-slate-500 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">

                    </div>


                    <div class="md:col-span-2">

                        <label class="block font-semibold mb-2 text-slate-300">
                            Student Image
                        </label>

                        <div class="bg-slate-800 border border-slate-700 border-dashed rounded-xl p-4">

                            <input type="file"
                                name="image"
                                class="w-full text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white file:font-semibold hover:file:bg-blue-500 file:cursor-pointer">

                        </div>

                    </div>

                </div>


                <div class="flex justify-center gap-4 mt-10">

                    <button type="submit"
                        class="bg-blue-600 text-white px-8 py-3 rounded-xl font-semibold hover:bg-blue-500 shadow-lg shadow-blue-900/20 transition">

                        <i class="bi bi-check-circle-fill mr-2"></i>
                        Save Student

                    </button>


                    <button type="reset"
                        class="bg-slate-700 text-slate-200 px-8 py-3 rounded-xl font-semibold hover:bg-slate-600 transition">

                        <i class="bi bi-arrow-clockwise mr-2"></i>
                        Reset

                    </button>

                </div>

            </form>

        </div>

    </div>

{% endblock contain %}
