{% extends "base.html" %}

{% block contain %}

    <div class="max-w-7xl mx-auto px-6 py-8">

        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8">

            <div>

                <p class="text-blue-400 text-sm font-semibold uppercase tracking-wider mb-1">
                    Examination Management
                </p>

                <h1 class="text-3xl font-bold text-white">
                    Exam Results
                </h1>

                <p class="text-slate-400 mt-1">
                    View and manage students' exam results.
                </p>

            </div>

            <a href="#"
                class="mt-4 md:mt-0 bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl shadow-lg shadow-blue-900/20 font-semibold transition">

                <i class="bi bi-plus-circle-fill mr-2"></i>
                Add Result

            </a>

        </div>


        <!-- Filter Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-6 mb-6">

            <div class="grid grid-cols-1 md:grid-cols-5 gap-4">

                <div class="relative">

                    <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>

                    <input type="text"
                        placeholder="Search Student..."
                        class="w-full bg-slate-800 border border-slate-700 text-white placeholder-slate-500 rounded-xl pl-11 pr-4 py-3 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none">

                </div>


                <select
                    class="bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none">

                    <option>All Subjects</option>
                    <option>Python</option>
                    <option>Java</option>
                    <option>Web Development</option>
                    <option>Database</option>

                </select>


                <select
                    class="bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none">

                    <option>All Grades</option>
                    <option>A+</option>
                    <option>A</option>
                    <option>B+</option>
                    <option>B</option>
                    <option>C</option>
                    <option>Fail</option>

                </select>


                <input type="date"
                    class="bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none">


                <button
                    class="bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold shadow-lg shadow-blue-900/20 transition">

                    <i class="bi bi-funnel-fill mr-2"></i>
                    Filter

                </button>

            </div>

        </div>


        <!-- Results Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden">

            <div class="overflow-x-auto">

                <table class="w-full">

                    <thead class="bg-slate-950 border-b border-slate-800">

                        <tr>

                            <th class="px-6 py-4 text-left text-slate-400 font-semibold">
                                #
                            </th>

                            <th class="px-6 py-4 text-left text-slate-400 font-semibold">
                                Student
                            </th>

                            <th class="px-6 py-4 text-left text-slate-400 font-semibold">
                                Subject
                            </th>

                            <th class="px-6 py-4 text-center text-slate-400 font-semibold">
                                Marks
                            </th>

                            <th class="px-6 py-4 text-center text-slate-400 font-semibold">
                                Grade
                            </th>

                            <th class="px-6 py-4 text-center text-slate-400 font-semibold">
                                Exam Date
                            </th>

                            <th class="px-6 py-4 text-center text-slate-400 font-semibold">
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        <tr class="border-b border-slate-800 hover:bg-slate-800/50 transition">

                            <td class="px-6 py-4 text-slate-400">
                                1
                            </td>

                            <td class="px-6 py-4 font-medium text-white">
                                Rahul Patel
                            </td>

                            <td class="px-6 py-4 text-slate-300">
                                Python
                            </td>

                            <td class="px-6 py-4 text-center text-emerald-400 font-semibold">
                                92
                            </td>

                            <td class="px-6 py-4 text-center">

                                <span class="inline-flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full text-sm font-medium">

                                    <i class="bi bi-award-fill"></i>
                                    A+

                                </span>

                            </td>

                            <td class="px-6 py-4 text-center text-slate-400">
                                15-06-2026
                            </td>

                            <td class="px-6 py-4 text-center">

                                <button
                                    class="bg-yellow-500/10 border border-yellow-500/20 text-yellow-400 hover:bg-yellow-500 hover:text-white px-4 py-2 rounded-lg transition">

                                    <i class="bi bi-pencil-fill mr-1"></i>
                                    Edit

                                </button>

                                <button
                                    class="bg-red-500/10 border border-red-500/20 text-red-400 hover:bg-red-600 hover:text-white px-4 py-2 rounded-lg ml-2 transition">

                                    <i class="bi bi-trash-fill mr-1"></i>
                                    Delete

                                </button>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

{% endblock contain %}
