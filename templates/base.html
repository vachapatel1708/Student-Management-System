<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Student Management System</title>
</head>

<body class="bg-slate-950">

    <nav class="relative z-50 bg-slate-900/95 backdrop-blur-xl text-white px-8 py-4 border-b border-slate-800 shadow-xl">

        <div class="flex items-center justify-between">

            <div class="flex items-center gap-3">

                <div class="w-11 h-11 rounded-xl bg-blue-600/10 border border-blue-500/20 flex items-center justify-center">
                    <i class="bi bi-mortarboard-fill text-3xl text-blue-400"></i>
                </div>

                <div>
                    <h1 class="text-2xl font-bold tracking-wide">SMS</h1>
                    <p class="text-xs text-slate-400">Student Management System</p>
                </div>

            </div>


            <div class="flex items-center gap-8 font-medium">

                <a href="/" class="text-slate-300 hover:text-blue-400 transition">
                    Home
                </a>


                <div class="relative group">

                    <button class="flex items-center gap-1 text-slate-300 hover:text-blue-400 cursor-pointer transition">
                        Student
                        <i class="bi bi-chevron-down text-sm"></i>
                    </button>

                    <div class="absolute left-0 top-full hidden group-hover:block pt-3 z-[100]">

                        <div class="bg-slate-900 border border-slate-700 text-white rounded-xl shadow-2xl w-52 overflow-hidden">

                            <a href="/showlist"
                                class="block px-4 py-3 hover:bg-blue-600/10 hover:text-blue-400 transition">
                                Show Students
                            </a>

                            <a href="/addstudent"
                                class="block px-4 py-3 hover:bg-blue-600/10 hover:text-blue-400 transition">
                                Add Student
                            </a>

                        </div>

                    </div>

                </div>


                <div class="relative group">

                    <button class="flex items-center gap-1 text-slate-300 hover:text-blue-400 cursor-pointer transition">
                        Payment
                        <i class="bi bi-chevron-down text-sm"></i>
                    </button>

                    <div class="absolute left-0 top-full hidden group-hover:block pt-3 z-[100]">

                        <div class="bg-slate-900 border border-slate-700 text-white rounded-xl shadow-2xl w-52 overflow-hidden">

                            <a href="/showpayment"
                                class="block px-4 py-3 hover:bg-blue-600/10 hover:text-blue-400 transition">
                                Show Payment
                            </a>

                            <a href="/addpayment"
                                class="block px-4 py-3 hover:bg-blue-600/10 hover:text-blue-400 transition">
                                Add Payment
                            </a>

                        </div>

                    </div>

                </div>


                <a href="/attendance" class="text-slate-300 hover:text-blue-400 transition">
                    Attendance
                </a>

                <a href="/exam" class="text-slate-300 hover:text-blue-400 transition">
                    Exams
                </a>

                <a href="/about" class="text-slate-300 hover:text-blue-400 transition">
                    About
                </a>

            </div>


            <div class="flex items-center gap-4">

                <form method="GET" action="" class="relative">

                    <input type="search"
                        name="search"
                        placeholder="Search..."
                        class="w-64 pl-10 pr-4 py-2 rounded-full text-white bg-slate-800 border border-slate-700 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">

                    <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>

                </form>


                <form method="POST" action="{% url 'logout' %}">

                    {% csrf_token %}

                    <button type="submit"
                        class="px-4 py-2 border border-slate-600 text-slate-300 rounded-lg hover:bg-slate-800 hover:text-white hover:border-slate-500 transition">
                        Logout
                    </button>

                </form>


                <a href="/register"
                    class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-500 shadow-lg shadow-blue-900/20 transition">
                    Register
                </a>

            </div>

        </div>

    </nav>


    {% block contain %}
      
    {% endblock contain %}

</body>
</html>
