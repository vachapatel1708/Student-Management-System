{% extends "base.html" %}

{% block contain %}

    <section class="py-12 px-4">
        <div class="max-w-2xl mx-auto">
            <div class="bg-slate-900 border border-slate-800 shadow-2xl rounded-2xl p-8">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center">
                        <i class="bi bi-credit-card-fill text-3xl text-blue-400"></i>
                    </div>
                    <h2 class="text-4xl font-bold text-white">
                        Add Payment
                    </h2>
                    <p class="text-slate-400 mt-2">
                        Enter payment details below
                    </p>
                </div>
                <form method="post" class="space-y-5">
                    {% csrf_token %}
                    <div>
                        <label class="block mb-2 font-semibold text-slate-300">
                            Student
                        </label>
                        <select name="student"
                            class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                            <option>Select Student</option>
                            {% for i in student %}
                                <option value="{{i.id}}" name="name">
                                    {{i.name}}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block mb-2 font-semibold text-slate-300">
                            Payment Amount
                        </label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-emerald-400 font-semibold">
                                ₹
                            </span>
                            <input type="number"
                                name="payment_amount"
                                placeholder="Enter Payment Amount"
                                class="w-full bg-slate-800 border border-slate-700 text-white placeholder-slate-500 rounded-xl pl-9 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                        </div>
                    </div>
                    <div>
                        <label class="block mb-2 font-semibold text-slate-300">
                            Payment Date
                        </label>
                        <input type="date"
                            name="date"
                            class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block mb-2 font-semibold text-slate-300">
                            Collected By
                        </label>
                        <input type="text"
                            name="taken_by"
                            placeholder="Enter Staff Name"
                            class="w-full bg-slate-800 border border-slate-700 text-white placeholder-slate-500 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block mb-2 font-semibold text-slate-300">
                            Payment Method
                        </label>
                        <select name="payment_method"
                            class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                            <option>Cash</option>
                            <option>Online</option>
                            <option>Card</option>
                        </select>
                    </div>
                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-blue-900/20 transition duration-300">
                        <i class="bi bi-check-circle-fill mr-2"></i>
                        Submit Payment
                    </button>
                </form>
            </div>
        </div>
    </section>

{% endblock contain %}
